}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07121f; --card:#0e2236; --ink:#e6f0fa; --muted:#9bb2c6; --accent:#5aaeff; --accent-ink:#04121f; --line:#25415a; --warn:#ffc857; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07121f; --card:#0e2236; --ink:#e6f0fa; --muted:#9bb2c6; --accent:#5aaeff; --accent-ink:#04121f; --line:#25415a; --warn:#ffc857; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#07121f}
.hud{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));max-width:340px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;box-sizing:border-box}
.hud h1{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:.01em}
.hud p{margin:0;font-size:.85rem;line-height:1.45;color:var(--muted)}
.hud .row{display:flex;gap:8px;flex-wrap:wrap}
.hud button{font:600 .9rem var(--sans);padding:9px 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.hud button.ghost{background:transparent;color:var(--accent)}
.hud button:disabled{opacity:.45;cursor:not-allowed}
.hud button:focus-visible,.hud summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hud details{font-size:.82rem;color:var(--muted);line-height:1.5}
.hud summary{cursor:pointer;color:var(--ink);font-weight:600}
.hud code{font-family:var(--mono);font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.hud ol{margin:6px 0 0;padding-inline-start:1.2rem}
.hud code{direction:ltr;unicode-bidi:isolate;display:inline-block}
#status{color:var(--ink)}
</style>

function makeGene(first){
  var codons;
  if(first){ codons=['AUG','GCU','UUC','GGA','UAA']; }
  else{
    var sense=CODONS.filter(function(c){return codonAA(c)!=='*'&&c!=='AUG';});

  }
  var mrna=codons.join('');
  return { codons:codons, mrna:mrna,
    coding:mrna.split('').map(function(b){return b==='U'?'T':b;}).join(''),
    template:mrna.split('').map(function(b){return M2T[b];}).join(''),
    protein:codons.slice(0,4).map(function(c){return AA3[codonAA(c)];}) };
}

  if(!opt.correct){ S.wrong++; bad(); haptic(); shake(card);
    var hint=tr('tlWrong');

    if(S.wrong>=3){ R.cards.forEach(function(c){ if(c.userData.opt.correct)c.userData.pulse=true; }); }

  S.busy=true; S.wrong=0; setInteractive([]); good(); haptic();

var clock=new THREE.Clock(), time=0, hoverSet=[];
function frame(){
  var dt=Math.min(clock.getDelta(),0.05); time+=dt;
  for(var i=tweens.length-1;i>=0;i--){ var tw=tweens[i]; tw.t+=dt; var k=Math.min(1,tw.t/tw.dur),e=k*k*(3-2*k); tw.fn(e); if(k>=1){ tweens.splice(i,1); if(tw.done)tw.done(); } }
  if(!S.busy){
    if(S.phase==='transcription'&&S.sub==='elongate'&&T.pairs){ T.pairs.forEach(function(pr,i){ pr.t.scale.setScalar(i===PROM+S.idx?1+0.1*Math.sin(time*7):1); }); }
    if(S.phase==='translation'&&R.tiles){ R.tiles.forEach(function(t,i){ t.scale.setScalar(Math.floor(i/3)===S.idx?1+0.07*Math.sin(time*7):1); }); }
  }
  if(hero)hero.rotation.x+=dt*0.4;
  if(S.phase==='transcription'&&T.pairs){
    if(S.carry&&T.poly){
      var okRay=false;
      if(renderer.xr.isPresenting&&lastCtl){ rayFrom(lastCtl); okRay=true; } else if(pointer.inside){ raycaster.setFromCamera(pointer.ndc,camera); okRay=true; }
      if(okRay&&raycaster.ray.intersectPlane(carryPlane,tmpV)){
        var tx=Math.max(-1.9,Math.min(1.9,tmpV.x)),ty=Math.max(0.9,Math.min(2.0,tmpV.y)),ax=DX(2.5),ay=YC-0.07;
        T.near=Math.hypot(tx-ax,ty-ay)<0.45?1:0; if(T.near){ tx=ax+(tx-ax)*0.25; ty=ay+(ty-ay)*0.25; }
        var kk=Math.min(1,dt*12); T.poly.position.x+=(tx-T.poly.position.x)*kk; T.poly.position.y+=(ty-T.poly.position.y)*kk; T.poly.position.z+=(Z+0.15-T.poly.position.z)*kk;
        T.poly.scale.setScalar(T.poly.scale.x+(1-T.poly.scale.x)*kk);
      }
    }
    T.phase+=dt*0.35;
    var pf=T.bound?(T.poly.position.x/DS+(NP-1)/2):-99;
    for(var pi=0;pi<T.pairs.length;pi++){ var pr=T.pairs[pi]; pr.u+=((Math.abs(pi-pf)<=3.3?1:0)-pr.u)*Math.min(1,dt*7); placePair(pr,pi,pr.u,T.phase); }
    var wp=(S.sub==='place')?(0.2+0.08*Math.sin(time*4)+(T.near?0.25:0)):0.07; T.promMat.opacity+=(wp-T.promMat.opacity)*Math.min(1,dt*10);
    var wt=T.flash?(0.2+0.12*Math.sin(time*8)):0.12; T.termMat.opacity+=(wt-T.termMat.opacity)*Math.min(1,dt*10);
  }
  pts.rotation.y+=dt*0.01;
  hoverSet=[];
  if(renderer.xr.isPresenting){
    controllers.forEach(function(c){ if(!c.visible){ return; } rayFrom(c); var h=firstHit(); if(h){ hoverSet.push(h.object); c.userData.line.scale.z=h.distance; } else c.userData.line.scale.z=3; });
  } else if(pointer.inside&&!drag){ raycaster.setFromCamera(pointer.ndc,camera); var h2=firstHit(); if(h2)hoverSet.push(h2.object); }
  interactables.forEach(function(o){ var tg=o.userData.hover||o; var bs=tg.userData.baseScale||1; var want=(hoverSet.indexOf(o)>=0?1.12:(o.userData.pulse?1.08+0.08*Math.sin(time*8):1))*bs; tg.scale.setScalar(tg.scale.x+(want-tg.scale.x)*Math.min(1,dt*14)); });
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(frame);
